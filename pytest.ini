[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py
testpaths = apps
addopts = -ra --strict-markers
filterwarnings =
    # Django 5.2 notes that URL form fields will assume https instead of http
    # from Django 6.0 on. That is what we want anyway, so nothing to change.
    ignore:The default scheme will be changed from 'http' to 'https' in Django 6.0:django.utils.deprecation.RemovedInDjango60Warning
