# Render Blueprint for a free-tier staging deploy (D44). Not for production:
# see docs/DECISIONS.md and the "Staging on Render" section of README.md for
# what the free tier does and does not give you.
#
# To use it: push this file to a Git host, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file and
# proposes the two resources below; values marked "sync: false" are asked for
# once, during that first setup screen.

databases:
  - name: pharmacy-staging-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17" # matches compose.yml (D26); Render's own default is newer

services:
  - type: web
    name: pharmacy-staging
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    # Free web services have no preDeployCommand (that needs a paid plan), so
    # migrate runs at the end of the build instead.
    buildCommand: "pip install -r requirements/prod.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: pharmacy-staging.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://pharmacy-staging.onrender.com
      - key: DJANGO_ADMIN_URL
        sync: false # type a hard-to-guess path (e.g. a random word + "/") when prompted
      - key: DJANGO_CLIENT_IP_HEADER
        value: HTTP_X_FORWARDED_FOR # Render's proxy sets this, not X-Real-IP
      - key: DJANGO_SERVE_MEDIA_VIA_DJANGO
        value: "true" # there is no Nginx here; see config/urls.py and D44
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacy-staging-db
          property: connectionString

# If the service name above changes, update DJANGO_ALLOWED_HOSTS and
# DJANGO_CSRF_TRUSTED_ORIGINS to match the new *.onrender.com address, and the
# README's URL. Render shows the final address once the service is created.
